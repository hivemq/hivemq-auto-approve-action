name: 'HiveMQ Auto-approve Release PRs'
description: 'Auto-approve narrow release PRs based on team membership and a file/line allowlist; dismiss stale auto-approvals.'

inputs:
  allowed-team:
    description: 'GitHub team slug (in the repository owner org). Only PRs opened by an active member are eligible.'
    required: true
  allowed-changes:
    description: >
      YAML list of rules, each { path: <JS regex>, lines?: <JS regex> }. Every
      changed file must match one rule by path; if that rule has `lines`, every
      added/removed line in the file must match it. At least one rule is
      required; `path` is mandatory, `lines` optional (omit to allow any change
      confined to that path).
    required: true
  github-token:
    description: 'Token whose identity performs the approval/dismissal (e.g. a service account). Needs pull-requests: write.'
    required: true
  reviewer-login:
    description: 'Login of the approver identity (= the github-token owner). Used to find and dismiss its own prior auto-approvals.'
    required: true
  dismiss-stale:
    description: >
      Whether an ineligible verdict dismisses this reviewer's earlier
      approvals. Set to false for every step but the last when a job chains
      several policies, so an ineligible policy does not dismiss the approval
      another policy just granted. The last step must keep it true, and must
      not be skippable for any reason other than an earlier step having
      approved, otherwise a stale approval survives.
    required: false
    default: 'true'

outputs:
  eligible:
    description: '"true" if the PR met team + allowlist criteria and was approved, otherwise "false".'

runs:
  using: node24
  main: dist/index.js

branding:
  icon: 'check-circle'
  color: 'green'
